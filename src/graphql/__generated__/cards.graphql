query GetCards($columnId: uuid!) {
  cards(
    where: { column_id: { _eq: $columnId } }
    order_by: { position: asc }
  ) {
    id
    title
    description
    position
    column_id
  }
}

mutation CreateCard(
  $columnId: uuid!
  $title: String!
  $description: String
  $position: numeric!
) {
  insert_cards_one(
    object: {
      column_id: $columnId
      title: $title
      description: $description
      position: $position
    }
  ) {
    id
    title
    position
  }
}
